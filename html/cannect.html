<section class="contoc">
<div class="contact-container">
    <h2>যোগাযোগ করুন</h2>
    
    <form id="whatsappForm">
      <div class="form-group">
        <label for="name">নাম</label>
        <input type="text" id="name" placeholder="আপনার নাম লিখুন" required>
      </div>

      <div class="form-group">
        <label for="email">ইমেইল</label>
        <input type="email" id="email" placeholder="আপনার ইমেইল লিখুন" required>
      </div>

      <div class="form-group">
        <label for="message">বার্তা</label>
        <textarea id="message" rows="4" placeholder="subject and giv me your phon number..." required></textarea>
      </div>
      <div class="bok">
        <button type="submit" class="butto">হোয়াটসঅ্যাপে পাঠান</button>
      </div>
    </form>
  </div>
</section>

<script>
  document.getElementById('whatsappForm').addEventListener('submit', function(e) {
    e.preventDefault(); // ফর্ম যেন রিলোড না হয়

    const phoneNumber = "8801913266964"; // তোমার WhatsApp নাম্বার (0 বাদ দিয়ে)

    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const message = document.getElementById('message').value;

    if (!name || !email || !message) {
      alert("সবগুলো ফিল্ড পূরণ করুন!");
      return;
    }

    // মেসেজ ফরম্যাট
    let fullMessage = `হ্যালো, ওয়েবসাইট থেকে নতুন মেসেজ:\n\n`;
    fullMessage += `*নাম:* ${name}\n`;
    fullMessage += `*ইমেইল:* ${email}\n`;
    fullMessage += `*বার্তা:* ${message}`;

    // এনকোড করে URL বানানো
    const whatsappURL = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(fullMessage)}`;

    // নতুন ট্যাবে ওপেন
    window.open(whatsappURL, '_blank');
  });
</script>
